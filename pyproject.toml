[project]
name = "rag-for-deployement"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hdRutvik114", email = "hdrutvik@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
rag-for-deployement = "rag_for_deployement:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
